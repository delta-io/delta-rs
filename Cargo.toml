[workspace]
members = ["crates/*", "python"]
exclude = []
resolver = "3"

[workspace.package]
authors = ["Qingping Hou <dave2008713@gmail.com>", "R Tyler Croy <rtyler@brokenco.de>"]
rust-version = "1.95.0"
keywords = ["deltalake", "delta", "datalake"]
readme = "README.md"
edition = "2024"
description = "Native Delta Lake implementation in Rust"
homepage = "https://github.com/delta-io/delta.rs"
license = "Apache-2.0"
documentation = "https://docs.rs/deltalake"
repository = "https://github.com/delta-io/delta.rs"

[workspace.dependencies]
#delta_kernel = { package = "buoyant_kernel", path = "../delta-kernel-rs/kernel", features = [
#delta_kernel = { package = "buoyant_kernel", git = "https://github.com/buoyant-data/delta-kernel-rs", rev = "ab66589067127b81c87690370e9b2c6e5129bcdf", features = [
delta_kernel = { package = "buoyant_kernel", git = "https://github.com/buoyant-data/delta-kernel-rs", rev = "e6b3ff5120149e22b19d9b5eb9213cb6cd4a0a41", features = [
    "arrow-60",
    "internal-api",
] }
#delta_kernel_default_engine = {  package = "buoyant_kernel_engine",  path = "../delta-kernel-rs/default-engine", features = ["arrow-59", "rustls"], default-features = false }
#delta_kernel_default_engine = {  package = "buoyant_kernel_engine",  git = "https://github.com/buoyant-data/delta-kernel-rs", rev = "ab66589067127b81c87690370e9b2c6e5129bcdf", features = ["arrow-59", "rustls"], default-features = false }
delta_kernel_default_engine = {  package = "buoyant_kernel_engine",  git = "https://github.com/buoyant-data/delta-kernel-rs", rev = "e6b3ff5120149e22b19d9b5eb9213cb6cd4a0a41", features = ["arrow-60", "rustls"], default-features = false }


# arrow
arrow = { version = "60" }
arrow-arith = { version = "60" }
arrow-array = { version = "60", features = ["chrono-tz"] }
arrow-buffer = { version = "60" }
arrow-cast = { version = "60" }
arrow-ipc = { version = "60" }
arrow-json = { version = "60" }
arrow-ord = { version = "60" }
arrow-row = { version = "60" }
arrow-schema = { version = "60" }
arrow-select = { version = "60" }
object_store = { version = "0.14.2" }
parquet = { version = "60" }

# datafusion 56
datafusion = { version = "56.0.0-dev" }
datafusion-datasource = { version = "56.0.0-dev" }
datafusion-physical-expr-adapter = { version = "56.0.0-dev" }
datafusion-ffi = { version = "56.0.0-dev" }
datafusion-proto = { version = "56.0.0-dev" }

# serde
serde = { version = "1.0.194", features = ["derive"] }
serde_json = "1"

# "stdlib"
bytes = { version = "1" }
chrono = { version = "0.4.40", default-features = false, features = ["clock"] }
time = { version = "=0.3.53" }
tracing = { version = "0.1", features = ["log"] }
regex = { version = "1" }
thiserror = { version = "2" }
url = { version = "2" }
percent-encoding-rfc3986 = { version = "0.1.3" }
tempfile = { version = "3" }
uuid = { version = "1" }

# runtime / async
async-trait = { version = "0.1" }
futures = { version = "0.3" }
tokio = { version = "1" }
typed-builder = { version = "0.23.0" }

# opentelemetry
tracing-opentelemetry = { version = "0.34" }
opentelemetry = { version = "0.33" }
opentelemetry-otlp = { version = "0.33", features = ["http-proto"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Temporary pin to unbreak Windows CI. cc 1.9.0 routes MSVC compiles through
# RUSTC_WRAPPER (https://github.com/rust-lang/cc-rs/pull/2022), and sccache's
# MSVC argument handling then breaks the C++ build of libmimalloc-sys on
# windows-latest runners ("/WX-" is consumed by cl.exe as a source file).
# Cargo.lock is gitignored, so the pin must live here; it is referenced by
# deltalake-python's build-dependencies to constrain workspace resolution.
# Remove once sccache handles -Tp/-Tc arguments (https://github.com/mozilla/sccache/issues/2062).
cc = "=1.8.0"

[workspace.metadata.typos]
files.extend-exclude = ["CHANGELOG.md", "crates/benchmarks/queries/tpcds/*.sql"]
default.extend-ignore-re = [
    # Custom ignore regex patterns: https://github.com/crate-ci/typos/blob/master/docs/reference.md#example-configurations
    "(?s)//\\s*spellchecker:ignore-next-line[^\\n]*\\n[^\\n]*",
    # Line block with # spellchecker:<on|off>
    "(?s)(#|//|<\\!--)\\s*spellchecker:off.*?\\n\\s*(#|//|<\\!--)\\s*spellchecker:on",
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    # workaround for: https://github.com/crate-ci/typos/issues/850
    "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
]

[workspace.metadata.typos.default.extend-words]
arro = "arro"
Arro = "Arro"
arro3 = "arro3"
Arro3 = "Arro3"
AKS = "AKS"
# to avoid using 'type' as a field name.
tpe = "tpe"

# ============================================================================
# Profile Configuration
# ============================================================================
# Profiles for different use cases:
# - dev: Fast local development with good debug experience (Cargo defaults)
# - test: test builds with minimal debug info to save disk/RAM (custom)
# - release: Production Rust crates - maximum performance (Cargo defaults)
# - bench: For benchmarking with flamegraphs (cargo bench)
# - profiling: For performance profiling with release opts + debug info
# - ci: CI/CD optimized - fast builds, release-like performance
# - python-release: Python wheel builds - portable, reproducible (PyPI releases)
# ============================================================================

# Test profile - reduced debug info to save disk/RAM
# Usage: cargo test (automatic)
# <https://github.com/delta-io/delta-rs/issues/1550>
[profile.test]
debug = "line-tables-only"

# Benchmark profile with debug symbols for flamegraphs
# Usage: cargo bench (automatic)
[profile.bench]
debug = true

# Profiling profile with release optimizations + debug info
# Usage: cargo build --profile=profiling
[profile.profiling]
inherits = "release"
debug = true

# CI profile - optimized for Continuous Integration
# Usage: cargo build --profile=ci
[profile.ci]
inherits = "dev"
# Line tables for workspace crates only, so panic backtraces have file and
# line numbers without the cost of debuginfo for all dependencies.
debug = "line-tables-only"
incremental = false

[profile.ci.package."*"]
opt-level = 3
debug = false
debug-assertions = false
strip = "debuginfo"
incremental = false

# Python wheel release profile - for PyPI distribution
# Usage: maturin build --profile python-release (via .github/workflows/python_release.yml)
[profile.python-release]
inherits = "release"
opt-level = 3
codegen-units = 1
lto = "fat"


# Python wheel release profile ARM - for PyPI distribution
# Usage: maturin build --profile python-release-arm (via .github/workflows/python_release.yml)
[profile.python-release-arm]
inherits = "release"
opt-level = 3
codegen-units = 1
lto = "thin"

