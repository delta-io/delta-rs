[package]
name = "deltalake-kernel-executor"
version = "2.0.0"
description = "DataFusion-backed executor for delta-kernel declarative plans"
authors.workspace = true
keywords.workspace = true
readme = "README.md"
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# `default-engine-base` provides `ArrowEngineData`, the Arrow-backed `EngineData`
# the executor hands query results back in.
delta_kernel = { workspace = true, features = [
    "declarative-plans",
    "default-engine-base",
    "vendored-protoc",
] }

# The storage / file-format handlers wrap the default engine's object_store
# based handlers, one per object store registered in the DataFusion session.
delta_kernel_default_engine = { workspace = true }

# arrow
arrow = { workspace = true }
object_store = { workspace = true }

# datafusion
datafusion = { workspace = true }
datafusion-datasource = { workspace = true }
datafusion-physical-expr-adapter = { workspace = true }

# "stdlib"
async-trait = { workspace = true }
bytes = { workspace = true }
dashmap = "6"
itertools = "0.15"
thiserror = { workspace = true }
url = { workspace = true }

# runtime
futures = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
arrow-array = { workspace = true }
rstest = { version = "0.27" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
# Experimental support for nanosecond timestamps primitive type
nanosecond-timestamps = ["delta_kernel/nanosecond-timestamps"]
