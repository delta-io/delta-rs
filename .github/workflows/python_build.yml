name: python_build

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main, next, next/*]

defaults:
  run:
    working-directory: ./python

env:
  PROFILE: ci
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  test-minimal:
    runs-on: ubuntu-latest
    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          python-version: '3.11'

      - name: Check Python
        run: |
          uv sync --no-install-project
          make check-python

      - name: Build and install deltalake
        run: |
          # Install minimum PyArrow version
          make develop
          uv pip install pyarrow==21.0.0

      - name: Run tests
        run: make unit-test

  test:
    name: Python Build (Python 3.11 PyArrow latest)
    runs-on: ubuntu-latest
    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Start emulated services
        run: docker compose up -d

      - name: Build and install deltalake
        run: make develop

      - name: Run tests
        run: uv run --no-sync pytest -n auto -m '((s3 or azure) and integration and not pyspark) or not integration and not benchmark and not no_pyarrow' --doctest-modules

      - name: Test without pandas
        run: |
          uv pip uninstall pandas
          uv run --no-sync pytest -n auto -m "not pandas and not integration and not benchmark and not no_pyarrow"

      - name: Test without pyarrow and without pandas
        run: |
          uv pip uninstall pyarrow
          uv run --no-sync pytest -n auto -m "not pyarrow and not pandas and not datafusion and not integration and not benchmark"

  test-datafusion:
    name: Python Build (Python 3.11 DataFusion integration)
    runs-on: ubuntu-latest

    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          python-version: '3.11'

      - name: Build and install deltalake
        run: make develop

      # Restore the DataFusion dependency and major-version assertion when 55.x wheels
      # are published. Until then, the integration test skips without a matching consumer.
      - name: Run DataFusion integration test
        run: DELTALAKE_RUN_DATAFUSION_TESTS=1 uv run --no-sync pytest -v tests/test_datafusion.py -m datafusion

  test-lakefs:
    name: Python Build (Python 3.11 LakeFS Integration tests)
    runs-on: ubuntu-latest

    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Start emulated services
        run: docker compose -f ../docker-compose-lakefs.yml up -d

      - name: Build and install deltalake
        run: make develop

      - name: Run tests
        run: uv run --no-sync pytest -m '(lakefs and integration)' --doctest-modules

  test-unitycatalog-databricks:
    name: Python Build (Python 3.11 Unity Catalog Integration tests)
    runs-on: ubuntu-latest

    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Mockoon CLI
        # <https://github.com/mockoon/cli-action/releases/tag/v3.0.0>
        uses: mockoon/cli-action@b935e787f80cca275e3834423e7bffb6256180e2
        with:
          version: "latest"
          data-file: ".github/mockoon_data_files/unitycatalog_databricks.json"
          port: 8080

      - name: Build and install deltalake
        run: make develop

      - name: Run tests
        run: ../../delta-rs/.github/scripts/retry_integration_test.sh unitycatalog_databricks 5 10

  test-unitycatalog-oss:
    name: Python Build (Python 3.11 Unity Catalog Integration tests)
    runs-on: ubuntu-latest

    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Mockoon CLI
        # <https://github.com/mockoon/cli-action/releases/tag/v3.0.0>
        uses: mockoon/cli-action@b935e787f80cca275e3834423e7bffb6256180e2
        with:
          version: "latest"
          data-file: ".github/mockoon_data_files/unitycatalog_oss.json"
          port: 8080

      - name: Build and install deltalake
        run: make develop

      - name: Run tests
        run: ../../delta-rs/.github/scripts/retry_integration_test.sh unitycatalog_oss 5 10

  test-pyspark:
    name: PySpark Integration Tests
    runs-on: ubuntu-latest

    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # <https://github.com/actions/setup-java/releases/tag/v5.2.0>
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Start emulated services
        run: docker compose up -d

      - name: Build and install deltalake
        run: make develop-pyspark

      - name: Run tests
        run: make test-pyspark

  multi-python-running:
    name: Running with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install deltalake
        run: |
          make develop

      - name: Run deltalake
        run: |
          uv run --no-sync python -c 'import deltalake'

      - name: Run deltalake without pyarrow
        run: |
          uv pip uninstall pyarrow
          uv run --no-sync python -c 'import deltalake'

      - name: Run deltalake without pyarrow pandas
        run: |
          uv pip uninstall pyarrow pandas
          uv run --no-sync python -c 'import deltalake'

      - name: Run deltalake without pandas
        run: |
          uv pip install pyarrow
          uv run --no-sync python -c 'import deltalake'

  test-windows:
    name: Python Windows tests (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            architecture: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      # This job does not use setup-builder, which installs sccache.
      RUSTC_WRAPPER: ""
    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # <https://github.com/actions/setup-python/releases/tag/v6.2.0>
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
          architecture: ${{ matrix.architecture }}

      - name: Configure ARM64 native compiler
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          $llvm = "$env:ProgramFiles\LLVM\bin"
          if (!(Test-Path "$llvm\clang.exe") -or !(Test-Path "$llvm\clang-cl.exe")) {
            throw "LLVM clang and clang-cl are required for Windows ARM64"
          }
          $llvm >> $env:GITHUB_PATH
          "CC_aarch64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
          "CXX_aarch64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV

      - name: Install uv
        # <https://github.com/astral-sh/setup-uv/releases/tag/v8.0.0>
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: Install test dependencies
        if: matrix.architecture == 'x64'
        run: uv sync --python python --no-install-project --all-extras

      - name: Install test dependencies without optional extras
        if: matrix.architecture == 'arm64'
        run: uv sync --python python --no-install-project --no-group other

      - name: Build and install deltalake
        # <https://github.com/PyO3/maturin-action/releases/tag/v1.50.1>
        uses: messense/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad
        with:
          target: ${{ matrix.target }}
          rust-toolchain: stable
          working-directory: python
          command: develop
          args: --uv --profile ci

      - name: Assert Windows Python wheels do not select Unix-only OpenSSH
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree -p deltalake-python --target ${{ matrix.target }})

          if grep -Eq '(^|[[:space:]])openssh v' <<<"$tree"; then
            printf '%s\n' "$tree"
            printf '%s\n' "openssh must not be selected for the Windows Python target"
            exit 1
          fi

          if grep -Eq '(^|[[:space:]])opendal-service-sftp v' <<<"$tree"; then
            printf '%s\n' "$tree"
            printf '%s\n' "OpenDAL SFTP must not be selected for the Windows Python target"
            exit 1
          fi

      # Not enable in Windows arm64 because PyArrow has no Windows ARM64 wheels.
      - name: Install minimum PyArrow version
        if: matrix.architecture == 'x64'
        run: uv pip install pyarrow==21.0.0

      - name: Run unit tests and doctests
        if: matrix.architecture == 'x64'
        run: uv run --no-sync pytest -q -n auto --doctest-modules

      - name: Run unit tests without PyArrow and Pandas
        if: matrix.architecture == 'arm64'
        run: uv run --no-sync pytest -q -n auto -m "not pyarrow and not pandas and not datafusion and not integration and not benchmark"
