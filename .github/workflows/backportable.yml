name: backportable

# Evaluates whether a PR targeting `main` can be backported to `release/1.x`.
# A PR is backportable when its non-merge commits cherry-pick cleanly onto
# release/1.x AND `cargo semver-checks` passes for deltalake-core on the result.
#
# This workflow runs with a read-only token so that it is safe for fork PRs,
# whose code is built and executed here. It does not label the PR; it uploads
# the result as an artifact that `backportable-label.yml` consumes.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: backportable-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backportable:
    name: Backport check
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: release/1.x
          fetch-depth: 0

      - name: Cherry-pick PR commits onto release/1.x
        id: pick
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"

          commits=$(git rev-list --reverse --no-merges "${BASE_SHA}..${HEAD_SHA}")
          if [ -z "$commits" ]; then
            echo "No non-merge commits to backport"
            echo "result=failure" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # shellcheck disable=SC2086
          if git cherry-pick $commits; then
            echo "Cherry-pick succeeded"
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            git cherry-pick --abort || true
            echo "Cherry-pick conflicted with release/1.x"
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-builder
        if: steps.pick.outputs.result == 'success'

      - name: Semver check (deltalake-core) on backported tree
        if: steps.pick.outputs.result == 'success'
        id: semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # Use the stable toolchain installed by setup-builder; the action ignores rust-toolchain.toml
          rust-toolchain: manual
          package: deltalake-core
          features: datafusion
          # Namespace the rustdoc cache by PR so baselines never leak between PRs
          prefix-key: backportable-${{ github.event.pull_request.number }}

      - name: Record backportable result
        if: always()
        env:
          PICK_RESULT: ${{ steps.pick.outputs.result }}
          SEMVER_OUTCOME: ${{ steps.semver.outcome }}
        run: |
          set -uo pipefail
          mkdir -p backportable-result
          if [ "$PICK_RESULT" = "success" ] && [ "$SEMVER_OUTCOME" = "success" ]; then
            result=success
          else
            result=failure
          fi
          echo "PR #${PR_NUMBER} backportable: ${result}"
          printf '%s\n' "$result" > backportable-result/result

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backportable-result-${{ github.event.pull_request.number }}
          path: backportable-result/
          retention-days: 1
          if-no-files-found: error
