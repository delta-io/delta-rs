name: docs

on:
  merge_group:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - python/**
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  repository_dispatch:
    types:
      - release-docs
  # Allow manual trigger for now
  workflow_dispatch:

env:
  IS_RELEASE: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
  BUILD_ARGS: ${{ (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && 'install MATURIN_EXTRA_ARGS="--manylinux off"' || 'develop' }}

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # <https://github.com/tcort/markdown-link-check/releases/tag/v3.14.2>
      - uses: tcort/github-action-markdown-link-check@e7c7a18363c842693fadde5d41a3bd3573a7a225
        with:
          config-file: "docs/mlc_config.json"
          folder-path: docs
          base-branch: main
          use-quiet-mode: yes
          check-modified-files-only: yes

  lint:
    runs-on: ubuntu-latest
    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: |
          cd docs
          make check

  build-deploy:
    needs: [lint, markdown-link-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build and install deltalake
        run: |
          cd python
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          make ${{ env.BUILD_ARGS }}

      - name: Install dependencies
        run: |
          source python/venv/bin/activate
          pip install -r docs/requirements.txt

      - name: Get changelog for docs
        run: |
          cd .github/scripts/
          ./docs_changelog.sh

      - name: Build
        run: |
          source python/venv/bin/activate
          mkdocs build

      - name: Resolve the docs version
        if: ${{ env.IS_RELEASE == 'true' }}
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          if [[ "$TAG" == python-v* ]]; then
            # A python release. Publish the docs under that release number.
            VERSION="${TAG#python-v}"
          else
            # A docs-only merge or a manual run. Update the current release in place,
            # so documentation fixes reach readers without waiting for a release.
            VERSION=$(grep -m1 '^version' python/Cargo.toml | awk '{print $3}' | tr -d '"')
          fi
          echo "DOCS_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing docs as version $VERSION"

      - name: Deploy
        if: ${{ env.IS_RELEASE == 'true' }}
        env:
          DEPLOY_TAG: ${{ github.event.client_payload.tag || github.ref_name }}
        run: |
          source python/venv/bin/activate
          git config user.name "Github Action"
          git config user.email "deltars@users.noreply.github.com"
          # mike commits on top of gh-pages, so it needs that branch in full.
          # The default shallow checkout still fetches the branch complete.
          git fetch origin gh-pages:gh-pages || echo "gh-pages is missing; mike will create it"
          mike deploy --push --update-aliases \
            --message "doc update for tag \`$DEPLOY_TAG\`" \
            "$DOCS_VERSION" latest
          mike set-default --push latest
